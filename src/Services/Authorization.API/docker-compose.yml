services:
  auth-service-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyVeryStrongPassword1234321
      - MSSQL_PID=Developer
    volumes:
      - auth-service-db:/var/lib/mssql/data
    container_name: auth_service_db

volumes:
  auth-service-db: