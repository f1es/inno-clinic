services:
  services-mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - 1433:1433
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyStrongPassword1234321
      - MSSQL_PID=Developer
    volumes:
      - services-service-db:/var/lib/mssql/data
    container_name: services_service_db
    
volumes:
  services-service-db: